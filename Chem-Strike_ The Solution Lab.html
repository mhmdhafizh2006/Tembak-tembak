<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chem-Strike: The Solution Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0a24;--ink:#eaf6ff;--dim:#9aa7d6;--cy:#5ef2ff;--mg:#ff4fa3;--am:#ffc857;--mi:#7dffb3;--vi:#b388ff;--pn:rgba(22,17,64,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;background:linear-gradient(rgba(94,242,255,.045) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(94,242,255,.045) 1px,transparent 1px) 0 0/34px 100%,radial-gradient(800px 500px at 85% -10%,rgba(179,136,255,.3),transparent 60%),radial-gradient(700px 500px at 0 100%,rgba(94,242,255,.16),transparent 60%),var(--bg);overflow:hidden}
#app{max-width:560px;height:100%;margin:auto;display:flex;flex-direction:column}
#scr{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.hud{display:flex;align-items:center;gap:12px;padding:10px 14px;font-weight:600}.hud[hidden]{display:none}
.hud .en{flex:1;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--dim)}
.bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.sc{color:var(--am);font-size:1.1rem;min-width:56px;text-align:right}
.pad{padding:18px 16px 24px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;letter-spacing:.04em;background:linear-gradient(95deg,var(--cy),var(--vi) 55%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(94,242,255,.45))}
h2{margin:0;font-size:1.5rem}p{margin:0}.dim{color:var(--dim);line-height:1.5}
.btn{border:0;color:#07121f;font-weight:700;font-size:1.05rem;padding:14px 20px;background:linear-gradient(95deg,var(--cy),var(--vi));clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:0 0 20px rgba(94,242,255,.4)}
.btn.alt{background:rgba(94,242,255,.16);color:var(--cy)}.btn:disabled{opacity:.5}.btn:active{transform:scale(.98)}
.ttl{flex:1;justify-content:center;align-items:center;text-align:center;gap:16px}
.ttl input{width:100%;max-width:300px;padding:13px 14px;border-radius:12px;border:1px solid rgba(94,242,255,.4);background:rgba(94,242,255,.07);color:var(--ink);font:inherit;text-align:center}
.logo{width:120px;animation:fl 3s ease-in-out infinite}.logo circle{animation:bub 2.4s ease-in infinite}.logo circle:nth-of-type(2){animation-delay:.8s}.logo circle:nth-of-type(3){animation-delay:1.5s}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid rgba(94,242,255,.35);background:transparent;color:var(--dim);font-weight:600}.tabs .on{background:rgba(94,242,255,.18);color:var(--cy);border-color:var(--cy)}
.holo{border:1px solid rgba(94,242,255,.4);border-radius:16px;padding:12px;background:linear-gradient(rgba(94,242,255,.1),rgba(94,242,255,.03));box-shadow:0 0 24px rgba(94,242,255,.15) inset}
.bvw{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}.bk{height:128px;width:auto}.ar{font-size:1.8rem;color:var(--cy)}
.eq{flex:1;min-width:150px;display:grid;gap:4px;text-align:center;color:var(--dim)}.big2{font-size:1.7rem;font-weight:700;color:var(--mi)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-top:6px;color:var(--dim)}.sl b{color:var(--cy)}.sl input{grid-column:1/3;width:100%;accent-color:var(--cy)}
.arena{flex:0 0 42%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 100%,rgba(94,242,255,.25),transparent 65%),linear-gradient(#171045,#0d0a24);border-bottom:2px solid rgba(94,242,255,.5)}
.arena.flash::after{content:"";position:absolute;inset:0;background:var(--mg);opacity:.35;animation:fo .5s forwards}
.mname{position:absolute;top:6px;width:100%;text-align:center;font-weight:700;font-size:.95rem}
.hp{position:absolute;top:30px;left:19%;width:62%;height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--mg),var(--am));transition:width .4s}
.mw{position:absolute;left:0;right:0;top:46px;bottom:92px;display:flex;justify-content:center}.mw svg{height:100%;width:auto;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,255,255,.25))}
.mw.hit svg{animation:sh .35s;filter:brightness(2.2)}.mw.die svg{animation:die .9s forwards}
.tur{position:absolute;bottom:2px;left:50%;width:84px;margin-left:-42px}
.beam{position:absolute;left:50%;width:14px;margin-left:-7px;top:60px;bottom:90px;transform-origin:bottom;background:linear-gradient(#fff,var(--cy),var(--vi));border-radius:8px;box-shadow:0 0 22px var(--cy);animation:bm .6s forwards}
.dmg{position:absolute;left:50%;top:40%;margin-left:-20px;font-size:2rem;font-weight:700;color:var(--am);text-shadow:0 0 10px #000;animation:up .6s forwards}
.panel{flex:1;overflow:auto;padding:14px 16px 18px;background:var(--pn);border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px)}
.q{line-height:1.45;font-size:1.05rem}.qbar{height:5px;border-radius:4px;background:rgba(255,255,255,.1)}.qbar i{display:block;height:100%;width:100%;background:var(--am);border-radius:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:13px 8px;border-radius:12px;border:1px solid rgba(94,242,255,.4);background:rgba(94,242,255,.08);color:var(--ink);font-weight:600;font-size:1rem}
.opt.ok{background:rgba(125,255,179,.25);border-color:var(--mi)}.opt.no{background:rgba(255,79,163,.25);border-color:var(--mg)}
.res{display:grid;gap:4px;padding:10px 12px;border-radius:12px;font-size:.95rem;line-height:1.45}.res.ok{background:rgba(125,255,179,.12);border-left:3px solid var(--mi)}.res.no{background:rgba(255,79,163,.12);border-left:3px solid var(--mg)}
.dl,.dr{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(135deg,#2a2160 0 14px,#3b3084 14px 28px);transition:transform 1.1s}.dl{left:0;border-right:2px solid var(--cy)}.dr{right:0;border-left:2px solid var(--cy)}
.glow{position:absolute;inset:0;background:radial-gradient(circle,var(--mi),transparent 70%);opacity:0;transition:opacity 1.1s}.open .glow{opacity:.55}.open .dl{transform:translateX(-101%)}.open .dr{transform:translateX(101%)}
.bkw{position:absolute;inset:26px 0 4px;display:flex;justify-content:center}.bkw .bk{height:100%}
.rk{font-size:1.8rem;font-weight:700;color:var(--mi)}.row{display:grid;gap:4px}.row span{display:flex;justify-content:space-between;font-size:.92rem}.row .bar{height:12px}
@keyframes fl{50%{transform:translateY(-8px)}}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes die{to{transform:scale(0) rotate(40deg);opacity:0}}@keyframes bm{0%{transform:scaleY(0)}40%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes up{to{transform:translateY(-40px);opacity:0}}@keyframes fo{to{opacity:0}}@keyframes bub{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="app"><div class="hud" id="hud" hidden></div><div id="scr"></div></div>
<script>
const $=s=>document.querySelector(s),f=x=>String(+(+x).toPrecision(4)).replace('.',','),R=a=>a[Math.random()*a.length|0],shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let AC;function snd(fr,d=.12,t='sine',v=.06){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=fr;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{snd(660,.1);setTimeout(()=>snd(990,.15),90)},bad=()=>snd(130,.3,'sawtooth'),zap=()=>snd(1400,.25,'square',.03);
const CAT={mol:'Molaritas (M = n/V)',mass:'Massa ke mol (n = m/Mr)',dil:'Pengenceran (V₁M₁ = V₂M₂)'};
const ST=[{n:'Asam Pekat Mk-I',color:'#ff4fa3',hits:3,types:['mol','mol','mass'],tag:'H₂SO₄',door:{M1:2,V1:100,M2:.5}},
{n:'Anomali Basa',color:'#ffc857',hits:3,types:['mass','mol2','mass'],tag:'NaOH',door:{M1:4,V1:50,M2:1}},
{n:'Boss Molaritas',color:'#b388ff',hits:4,types:['mol','dil','mol2','dil'],tag:'M = n/V',door:{M1:6,V1:100,M2:2}}];
let S={name:'Siswa'},B={n:.5,V:250,M1:4,V1:100,M2:1,tab:0};
function reset(nm){S={name:nm,st:0,en:100,sc:0,streak:0,hp:100,qn:0,retry:0,k:{mol:[0,0],mass:[0,0],dil:[0,0]},t0:Date.now()}}
function beaker(n,lv,M,col){const h=Math.max(lv*108,4),y=122-h;let d='';for(let i=0;i<Math.min(Math.round(n),130);i++)d+=`<circle cx="${(26+(i*.6180339%1)*68).toFixed(1)}" cy="${(120-(i*.7548777%1)*Math.max(h-6,1)).toFixed(1)}" r="2.3" fill="#fff" opacity=".9"/>`;
return `<svg viewBox="0 0 120 140" class="bk"><rect x="22" y="${y}" width="76" height="${h}" rx="3" fill="rgba(${col},${(.18+.6*Math.min(M/6,1)).toFixed(2)})"/>${d}<path d="M20 8V124Q20 132 28 132H92Q100 132 100 124V8" fill="none" stroke="#9fe9ff" stroke-width="3" stroke-linecap="round"/></svg>`}
function monster(i){const c=ST[i].color,E=i==2?[[62,92,11],[138,92,11],[100,68,9]]:[[70,92,14],[130,92,14]];
const back=i==1?`<path d="M50 168q-10 20 0 34M85 176q-6 20 4 26M120 176q8 20-2 26M152 166q12 18 0 32" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>`:i==0?`<path d="M60 40l-8-28 24 16M100 28V0l14 26M140 40l8-28-24 16" fill="${c}"/>`:`<path d="M55 40l15-32 15 22 15-30 15 30 15-22 15 32z" fill="#ffe27a"/>`;
return `<svg viewBox="0 0 200 210">${back}<path d="M30 125C18 65 68 28 100 28S182 65 170 125C165 162 140 182 100 182S35 162 30 125Z" fill="${c}"/><path d="M45 120C40 80 70 48 100 48" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="6" stroke-linecap="round"/>${E.map(e=>`<circle cx="${e[0]}" cy="${e[1]}" r="${e[2]}" fill="#fff"/><circle cx="${e[0]+2}" cy="${e[1]+2}" r="${e[2]/2}" fill="#1a0f2e"/>`).join('')}<path d="M65 132l12 12 12-12 12 12 12-12 12 12 12-12" stroke="#1a0f2e" stroke-width="5" fill="none" stroke-linejoin="round"/><text x="100" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#1a0f2e">${ST[i].tag}</text></svg>`}
const TUR=`<svg class="tur" viewBox="0 0 100 90"><rect x="38" y="0" width="24" height="26" rx="5" fill="#5ef2ff"/><path d="M40 26h20l22 42H18z" fill="rgba(94,242,255,.25)" stroke="#5ef2ff" stroke-width="3"/><path d="M26 54h48l8 14H18z" fill="#5ef2ff" opacity=".85"/><rect x="10" y="70" width="80" height="14" rx="6" fill="#2b2470" stroke="#5ef2ff" stroke-width="2"/></svg>`;
function hud(){const h=$('#hud');h.hidden=false;h.innerHTML=`<div>Zona ${S.st+1}/3</div><div class="en">Energi<div class="bar"><i style="width:${S.en}%;background:${S.en<35?'var(--mg)':'var(--cy)'}"></i></div></div><div class="sc">${S.sc}</div>`}
function title(){$('#hud').hidden=true;$('#scr').innerHTML=`<div class="pad ttl"><svg class="logo" viewBox="0 0 100 120"><circle cx="40" cy="22" r="4" fill="#7dffb3"/><circle cx="58" cy="18" r="3" fill="#ff4fa3"/><circle cx="50" cy="26" r="2.5" fill="#5ef2ff"/><rect x="38" y="30" width="24" height="26" rx="4" fill="none" stroke="#5ef2ff" stroke-width="4"/><path d="M40 56L12 106Q10 112 18 112H82Q90 112 88 106L60 56Z" fill="rgba(94,242,255,.12)" stroke="#5ef2ff" stroke-width="4" stroke-linejoin="round"/><path d="M26 84H74L84 106Q86 108 80 108H20Q14 108 16 106Z" fill="#ff4fa3" opacity=".85"/></svg><div><h1>CHEM-<br>STRIKE</h1><p style="margin-top:8px;font-size:1.2rem;letter-spacing:.3em;color:var(--cy)">The Solution Lab</p></div><p class="dim">Racik konsentrasi yang tepat untuk menembakkan laser larutan ke monster toksisitas, lalu netralkan wadah beracun dengan pengenceran.</p><input id="nm" maxlength="24" placeholder="Nama siswa" aria-label="Nama siswa"><button class="btn" onclick="begin()">Mulai misi</button></div>`}
function begin(){reset($('#nm').value.trim()||'Siswa');brief()}
function brief(){$('#hud').hidden=true;$('#scr').innerHTML=`<div class="pad"><h2>Laboratorium Hologram</h2><p class="dim">Geser slider dan amati titik-titik zat terlarut. Pahami dulu, baru bertempur.</p><div class="tabs"><button id="t0" onclick="tab(0)">Molaritas</button><button id="t1" onclick="tab(1)">Pengenceran</button></div><div class="holo" id="bv"></div><div id="sl"></div><button class="btn" onclick="fight()">Masuk arena</button></div>`;tab(B.tab)}
function sl(k,l,mn,mx,st,u){return `<label class="sl"><span>${l}</span><b id="v${k}">${f(B[k])} ${u}</b><input type="range" min="${mn}" max="${mx}" step="${st}" value="${B[k]}" oninput="sv('${k}',this,'${u}')"></label>`}
function tab(t){B.tab=t;$('#t0').className=t?'':'on';$('#t1').className=t?'on':'';$('#sl').innerHTML=t?sl('M1','Molaritas pekat (M₁)',1,8,.5,'M')+sl('V1','Volume awal (V₁)',25,250,25,'mL')+sl('M2','Molaritas target (M₂)',.5,8,.5,'M'):sl('n','Mol zat terlarut (n)',.05,2,.05,'mol')+sl('V','Volume larutan (V)',100,1000,50,'mL');bv()}
function sv(k,el,u){B[k]=+el.value;$('#v'+k).textContent=f(B[k])+' '+u;bv()}
function bv(){let h;if(!B.tab){const L=B.V/1000,M=B.n/L;h=`<div class="bvw">${beaker(B.n*60,L,M,'94,242,255')}<div class="eq"><div>M = n ÷ V</div><div>M = ${f(B.n)} ÷ ${f(L)} L</div><div class="big2">${f(M)} M</div></div></div>`}
else{const M2=Math.min(B.M2,B.M1),V2=B.V1*B.M1/M2,n=B.M1*B.V1/1000*60;h=`<div class="bvw">${beaker(n,B.V1/V2,B.M1,'255,79,163')}<span class="ar">→</span>${beaker(n,1,M2,'255,79,163')}<div class="eq" style="flex-basis:100%"><div>V₁M₁ = V₂M₂</div><div>${f(B.V1)} × ${f(B.M1)} = V₂ × ${f(M2)}</div><div>V₂ = ${f(V2)} mL</div><div class="big2">Tambah ${f(V2-B.V1)} mL air</div>${B.M2>B.M1?'<div style="color:var(--am)">M₂ tidak boleh lebih besar dari M₁</div>':''}</div></div>`}$('#bv').innerHTML=h}
function opts(a,u,w){const seen=new Set([f(a)]),o=[{t:f(a)+' '+u,ok:1}];for(const x of [...w,a*3,a*4,a+1]){const k=f(x);if(x>0&&isFinite(x)&&!seen.has(k)&&o.length<4){seen.add(k);o.push({t:k+' '+u})}}return shuf(o)}
function mk(ty){let n,V,m,M,a;
if(ty=='mol'){n=R([.1,.2,.25,.5,1,2]);V=R([100,200,250,500]);a=n*1000/V;return{cat:'mol',text:`Berapa molaritas larutan yang mengandung ${f(n)} mol ${R(['NaOH','HCl','KOH'])} dalam ${V} mL larutan?`,opts:opts(a,'M',[n/V,a*2,a/2,V/n]),ex:`Ubah mL ke L: ${V} mL = ${f(V/1000)} L. M = n ÷ V = ${f(n)} ÷ ${f(V/1000)} = ${f(a)} M.`}}
if(ty=='mass'){m=R([2,4,8,10,20]);V=R([100,200,250,500]);n=m/40;a=n*1000/V;return{cat:'mass',text:`Sebanyak ${m} gram NaOH (Mr = 40) dilarutkan hingga volume ${V} mL. Berapa molaritasnya?`,opts:opts(a,'M',[m*1000/V,n/V,a*2,a/2]),ex:`n = m ÷ Mr = ${m} ÷ 40 = ${f(n)} mol. M = ${f(n)} ÷ ${f(V/1000)} L = ${f(a)} M.`}}
if(ty=='mol2'){M=R([.1,.2,.5,1,2]);V=R([100,250,500,1000]);n=M*V/1000;return{cat:'mol',text:`Larutan HCl ${f(M)} M sebanyak ${V} mL. Berapa mol HCl di dalamnya?`,opts:opts(n,'mol',[M*V,n*2,n/2,V/M]),ex:`n = M × V = ${f(M)} × ${f(V/1000)} L = ${f(n)} mol.`}}
const p=R([[4,1,200],[6,2,300],[5,1,250],[3,.5,300],[8,2,100]]);a=p[2]*p[1]/p[0];return{cat:'dil',text:`Untuk membuat ${p[2]} mL larutan ${f(p[1])} M dari larutan pekat ${f(p[0])} M, berapa mL larutan pekat yang harus dipipet?`,opts:opts(a,'mL',[p[2]-a,p[2]*p[0]/p[1],p[2],a*2]),ex:`V₁M₁ = V₂M₂, jadi V₁ = ${p[2]} × ${f(p[1])} ÷ ${f(p[0])} = ${f(a)} mL.`}}
function fight(){S.phase='fight';S.hp=100;S.qn=0;hud();$('#scr').innerHTML=`<div class="arena" id="ar"><div class="mname">${ST[S.st].n}</div><div class="hp"><i id="hp" style="width:100%"></i></div><div class="mw" id="mon">${monster(S.st)}</div>${TUR}</div><div class="panel" id="pn"></div>`;ask()}
function ask(){S.q=mk(ST[S.st].types[S.qn]);S.ans=0;S.left=40;$('#pn').innerHTML=`<div class="qbar"><i id="tb"></i></div><p class="q">${S.q.text}</p><div class="opts">${S.q.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">${o.t}</button>`).join('')}</div><div id="rs"></div>`;clearInterval(S.tm);S.tm=setInterval(()=>{S.left-=.1;const b=$('#tb');if(b)b.style.width=S.left/.4+'%';if(S.left<=0){clearInterval(S.tm);pick(-1)}},100)}
function pick(i){if(S.ans)return;S.ans=1;clearInterval(S.tm);const q=S.q,ok=i>=0&&q.opts[i].ok;S.k[q.cat][1]++;
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok');else if(j==i)b.classList.add('no')});
if(ok){S.k[q.cat][0]++;S.streak++;const g=100+Math.round(S.left*3)+S.streak*20;S.sc+=g;good();$('#rs').innerHTML=`<div class="res ok"><b>Tepat! +${g} poin</b><span>${q.ex}</span></div><button class="btn" onclick="shoot()">Tembak laser larutan</button>`}
else{S.streak=0;S.en=Math.max(0,S.en-20);bad();const a=$('#ar');a.classList.add('flash');setTimeout(()=>a.classList.remove('flash'),500);$('#rs').innerHTML=`<div class="res no"><b>${i<0?'Waktu habis!':'Belum tepat.'} Energi -20</b><span>${q.ex}</span></div><button class="btn alt" onclick="S.en<=0?over():ask()">Lanjut</button>`}hud()}
function shoot(){$('#pn .btn').disabled=true;zap();const a=$('#ar'),H=ST[S.st].hits,be=document.createElement('div');be.className='beam';a.appendChild(be);
setTimeout(()=>{$('#mon').classList.add('hit');S.hp=Math.max(0,S.hp-100/H);S.qn++;$('#hp').style.width=S.hp+'%';const t=document.createElement('div');t.className='dmg';t.textContent='-'+Math.round(100/H);a.appendChild(t)},300);
setTimeout(()=>{be.remove();$('#mon').classList.remove('hit');const t=$('.dmg');if(t)t.remove();if(S.qn>=H){$('#mon').classList.add('die');snd(200,.5,'sawtooth');setTimeout(door,1000)}else ask()},900)}
function over(){S.retry++;$('#pn').innerHTML=`<div class="res no"><b>Energi habis.</b><span>Reaktor padam. Tinjau lagi rumusnya, lalu ulangi bagian ini dengan energi 60.</span></div><button class="btn" onclick="S.en=60;S.phase=='door'?door():fight()">Coba lagi</button>`}
function door(){const D=ST[S.st].door;S.phase='door';S.D=D;S.V2=D.V1*D.M1/D.M2;S.w=0;hud();$('#scr').innerHTML=`<div class="arena" id="ar"><div class="glow"></div><div class="dl"></div><div class="dr"></div><div class="mname" style="z-index:3">Pintu ruang ${S.st+1}: wadah beracun</div><div class="bkw" id="bk"></div></div><div class="panel" id="pn"><p class="q">Wadah berisi <b>${D.V1} mL</b> larutan <b>${f(D.M1)} M</b>. Encerkan hingga <b>${f(D.M2)} M</b> agar aman. Berapa mL air yang harus dituang?</p><label class="sl"><span>Air yang dituang</span><b id="wv">0 mL</b><input type="range" min="0" max="600" step="10" value="0" oninput="sw(this.value)"></label><button class="btn" onclick="pour()">Tuang air</button><div id="rs"></div></div>`;sw(0)}
function sw(v){S.w=+v;$('#wv').textContent=S.w+' mL';const D=S.D,T=D.V1+S.w;$('#bk').innerHTML=beaker(D.M1*D.V1/1000*60,T/(D.V1+600),D.M1*D.V1/T,'255,79,163')}
function pour(){const D=S.D,need=S.V2-D.V1,M=D.M1*D.V1/(D.V1+S.w);S.k.dil[1]++;
if(S.w===need){S.k.dil[0]++;S.sc+=300;good();setTimeout(()=>snd(1320,.3,'triangle'),200);$('#ar').classList.add('open');$('#pn').innerHTML=`<div class="res ok"><b>Pintu terbuka! +300 poin</b><span>V₂ = ${D.V1} × ${f(D.M1)} ÷ ${f(D.M2)} = ${f(S.V2)} mL, sehingga air yang ditambahkan ${f(need)} mL.</span></div><button class="btn" onclick="nxt()">${S.st<2?'Ke ruangan berikutnya':'Lihat rapor'}</button>`}
else{S.en=Math.max(0,S.en-15);bad();$('#rs').innerHTML=`<div class="res no"><b>Konsentrasi jadi ${f(M)} M, ${M>D.M2?'masih terlalu pekat':'terlalu encer'}. Energi -15</b><span>Wadah dikembalikan seperti semula. Hitung dengan V₁M₁ = V₂M₂, lalu kurangi V₁ dari V₂.</span></div>${S.en<=0?'<button class="btn alt" onclick="over()">Lanjut</button>':''}`}hud()}
function nxt(){if(S.st<2){S.st++;fight()}else rapor()}
const pc=(c,t)=>t?Math.round(c/t*100):0,lb=p=>p>=90?'Sempurna':p>=75?'Baik':p>=60?'Cukup':'Perlu latihan';
function rapor(){$('#hud').hidden=true;const T=Object.values(S.k),c=T.reduce((s,x)=>s+x[0],0),t=T.reduce((s,x)=>s+x[1],0),tot=pc(c,t),sec=Math.round((Date.now()-S.t0)/1000),tm=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),rk=tot>=90?'Master Larutan':tot>=75?'Analis Senior':tot>=60?'Asisten Lab':'Peneliti Pemula';
S.rekap=`Nama: ${S.name}\nSkor: ${S.sc}\n${Object.keys(CAT).map(k=>`${CAT[k]}: ${S.k[k][0]}/${S.k[k][1]} (${pc(...S.k[k])}%)`).join('\n')}\nAkurasi total: ${tot}%\nWaktu: ${tm}\nPercobaan ulang: ${S.retry}`;
$('#scr').innerHTML=`<div class="pad"><h2>Rapor Akurasi Konsep</h2><p class="dim">${S.name} · skor ${S.sc} · waktu ${tm}</p><div class="rk">${rk}</div><p>Akurasi total ${tot}%</p>${Object.keys(CAT).map(k=>{const p=pc(...S.k[k]);return `<div class="row"><span><b>${CAT[k]}</b><em>${S.k[k][1]?p+'% · '+lb(p):'belum diuji'}</em></span><div class="bar"><i style="width:${p}%;background:${p>=75?'var(--mi)':p>=60?'var(--am)':'var(--mg)'}"></i></div><span class="dim">${S.k[k][0]} benar dari ${S.k[k][1]} percobaan</span></div>`}).join('')}<button class="btn" onclick="cp(this)">Salin rekap hasil belajar</button><button class="btn alt" onclick="title()">Main lagi</button></div>`}
function cp(b){const ok=()=>b.textContent='Tersalin';try{navigator.clipboard.writeText(S.rekap).then(ok,()=>b.textContent='Gagal menyalin')}catch(e){b.textContent='Gagal menyalin'}}
title();
</script></body></html>
